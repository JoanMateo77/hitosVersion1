name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar (tipos, lint, RLS, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación: ninguna dependencia ejecuta código al instalarse.
      - run: npm ci --ignore-scripts
      - name: Tipos
        run: npm run typecheck
      - name: Lint (incluye reglas de arquitectura y secretos)
        run: npm run lint
      - name: RLS en todas las tablas
        run: npm run check:rls
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

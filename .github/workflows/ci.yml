name: CI

on:
  pull_request:
  push:
    branches: [master]

# El token del job solo lee el repo: el CI no publica nada.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar (tipos, lint, RLS, tests, build)
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA (cadena de suministro); el comentario dice la versión.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación: ninguna dependencia ejecuta código al instalarse.
      - run: npm ci --ignore-scripts
      - name: Tipos
        run: npm run typecheck
      - name: Lint (incluye reglas de arquitectura y secretos)
        run: npm run lint
      - name: RLS en todas las tablas
        run: npm run check:rls
      - name: Contraste del sistema de color
        run: npm run check:contrast
      - name: Funciones de Vercel cargan en Node
        run: npm run check:api
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Interacción real en el navegador contra el backend falso de e2e/mock.ts.
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: E2E del chat del coach
        run: npm run e2e:coach

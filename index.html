<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (display, opsz + wght variables) + Manrope (body, wght variable).
         Display swap evita el flash de texto invisible. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Theme-color declarativo por scheme: el status bar acierta antes de que el script corra. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05060f" />
    <!-- Aplica el tema guardado antes de pintar, para no parpadear claro/neón.
         Default = "claro" paper warm; usuarios con tema "oscuro" viejo caen a claro. -->
    <script>
      try {
        var raw = localStorage.getItem('hito-theme')
        var t = (raw === 'claro' || raw === 'neon') ? raw : 'claro'
        document.documentElement.dataset.theme = t
        var c = { claro: '#f5f0e6', neon: '#05060f' }[t]
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        if (c) metas.forEach(function (m) { m.setAttribute('content', c) })
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hito" />
    <meta
      name="description"
      content="Hito: define metas, recibí un plan del día y avanzá un paso por vez."
    />
    <title>Hito — metas con guía</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

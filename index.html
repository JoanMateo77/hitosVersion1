<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <!-- Aplica el tema guardado antes de pintar, para no parpadear claro/oscuro. -->
    <script>
      try {
        var t = localStorage.getItem('hito-theme') || 'oscuro'
        document.documentElement.dataset.theme = t
        var c = { claro: '#eef1f8', oscuro: '#0b1220', neon: '#05060f' }[t]
        var m = document.querySelector('meta[name="theme-color"]')
        if (m && c) m.setAttribute('content', c)
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hito" />
    <meta
      name="description"
      content="Hito: define metas, recibí un plan del día y avanzá un paso por vez."
    />
    <title>Hito — metas con guía</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo: una sola familia para toda la app (pesos 400 a 800).
         Display swap evita el flash de texto invisible. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Theme-color declarativo por scheme: el status bar acierta antes de que el script corra. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <!-- Aplica la variante guardada antes de pintar (sin parpadeo). Una identidad,
         dos variantes: claro/oscuro; "sistema" sigue al SO. Los temas viejos
         (negro, neón) migran a oscuro. -->
    <script>
      try {
        var raw = localStorage.getItem('hito-theme')
        var pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        var t = raw === 'claro' || raw === 'oscuro' ? raw
          : raw === 'negro' || raw === 'neon' ? 'oscuro'
          : pref
        document.documentElement.dataset.theme = t
        var c = { claro: '#f2f2f7', oscuro: '#000000' }[t]
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        if (c) metas.forEach(function (m) { m.setAttribute('content', c) })
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lógralo" />
    <meta
      name="description"
      content="Lógralo: metas con un compromiso real — sesiones, etapas y progreso que no se inventa."
    />
    <title>Lógralo — metas con compromiso</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

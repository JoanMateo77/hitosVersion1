# Hooks de git (se instalan solos con `npm install`).
pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: npx eslint --no-warn-ignored {staged_files}
      glob: "*.{ts,tsx,js,mjs}"
    - name: rls
      run: node scripts/check-rls.mjs
      glob: "supabase/**/*.sql"
    - name: contrast
      run: node scripts/check-contrast.mjs
      glob: "src/styles/{tokens,fullcolor}.css"
    # Las funciones de Vercel deben cargar en Node como en producción.
    - name: api
      run: node scripts/check-api.mjs
      glob: "{api,src/server,src/domain}/**/*.ts"

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck
    - name: test
      run: npm test

commit-msg:
  jobs:
    - name: conventional-commits
      run: npx commitlint --edit {1}
